<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace.ae</title>
  <meta name="description" content="Marketplace.ae is currently unavailable while we enhance the platform experience.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="hero">
    <div class="hero__background" aria-hidden="true"></div>
    <div class="hero__overlay" aria-hidden="true"></div>

    <header class="hero__header">
      <img
        src="assets/images/marketplace-logo.png"
        alt="Marketplace.ae logo"
        class="hero__logo"
        width="260"
        height="80"
      >
    </header>

    <section class="hero__message" aria-labelledby="main-heading">
      <h1 id="main-heading" class="hero__title">Thank you for visiting Marketplace.</h1>
      <p class="hero__subtitle">This website is currently unavailable as we continue to enhance the experience of our community.</p>
    </section>

    <section class="hero__enquiry" aria-label="Enquiry information">
      <p>For enquiries, please visit <a href="https://www.marketplace.ae" class="hero__link">XXXXX</a></p>
    </section>

    <footer class="hero__footer">
      <p class="hero__copyright">&copy; Marketplace.ae. All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
